name: Build and deploy metals-tutorials to Azure

env:
  RESOURCE_GROUP: expeditors-dzierzon-metals-rg
  REGISTRY_NAME: expeditorsdzierzonmetalsacr
  TUTORIALS_WEBAPP_NAME: expeditors-dzierzon-metals-tutorials
  IMAGE_TAG: latest

on:
  push:
    paths:
      - 'tutorials/**'
      - '.github/workflows/deploy-tutorials.yml'
  pull_request:
    paths:
      - 'tutorials/**'
      - '.github/workflows/deploy-tutorials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Matches the other deploy workflows: pushes/PRs only validate (build
  # locally, no registry push); real Azure changes happen on a manual dispatch
  # or a push to main. Split into two jobs so the validation job never
  # evaluates the Development environment's protection rules on an ordinary PR.
  build:
    if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build metals-tutorials image (validation only)
        working-directory: tutorials
        run: docker build --file Dockerfile --tag metals-tutorials:ci .

  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push metals-tutorials
        working-directory: tutorials
        run: |
          # az acr build checks --file against the current directory, not the
          # source argument, so this step runs from the site's own build context.
          az acr build --registry "$REGISTRY_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "metals-tutorials:$IMAGE_TAG" --file Dockerfile .

  deploy:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: none
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: Development
      url: https://${{ env.TUTORIALS_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the tutorials Web App at the new image and restart
        run: |
          registry_login_server=$(az acr show --name "$REGISTRY_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)
          az webapp config container set --name "$TUTORIALS_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" \
            --container-image-name "${registry_login_server}/metals-tutorials:${IMAGE_TAG}" \
            --container-registry-url "https://${registry_login_server}" --output none
          # config set alone does not force a re-pull when the tag is
          # unchanged (e.g. repeated ":latest" deploys), so restart explicitly.
          az webapp restart --name "$TUTORIALS_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --output none

      - name: Wait for the tutorials Web App to report healthy
        run: |
          host_name=$(az webapp show --name "$TUTORIALS_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName --output tsv)
          healthy=false
          for _ in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${host_name}/health" || true)
            if [[ "$status" == '200' ]]; then healthy=true; break; fi
            sleep 10
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::$TUTORIALS_WEBAPP_NAME did not report healthy at https://${host_name}/health within the timeout."
            exit 1
          fi
          echo "$TUTORIALS_WEBAPP_NAME is healthy: https://${host_name}/health"
