name: Build and deploy metals-ui to Azure

env:
  RESOURCE_GROUP: expeditors-dzierzon-metals-rg
  REGISTRY_NAME: expeditorsdzierzonmetalsacr
  UI_WEBAPP_NAME: expeditors-dzierzon-metals-ui
  IMAGE_TAG: latest

on:
  push:
    paths:
      - 'metals_ui/**'
      - '.github/workflows/deploy-ui.yml'
  pull_request:
    paths:
      - 'metals_ui/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Real Azure changes happen on a manual dispatch or a push to main (i.e. a
  # merge); other pushes/PRs only get a local build-only sanity check below.
  # Split into two jobs (rather than one job with a conditional
  # `environment:`) so the validation job never evaluates the Development
  # environment's protection rules on an ordinary push/PR.
  build:
    if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build metals-ui image (validation only)
        working-directory: metals_ui
        run: docker build --file Dockerfile --tag metals-ui:ci .

  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push metals-ui
        working-directory: metals_ui
        run: |
          # az acr build checks --file against the current directory, not the
          # source argument, so this step runs from the UI's own build context.
          az acr build --registry "$REGISTRY_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "metals-ui:$IMAGE_TAG" --file Dockerfile .

  deploy:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: none
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: Development
      url: https://${{ env.UI_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the UI Web App at the new image and restart
        run: |
          registry_login_server=$(az acr show --name "$REGISTRY_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)
          az webapp config container set --name "$UI_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" \
            --container-image-name "${registry_login_server}/metals-ui:${IMAGE_TAG}" \
            --container-registry-url "https://${registry_login_server}" --output none
          # config set alone does not force a re-pull when the tag is
          # unchanged (e.g. repeated ":latest" deploys), so restart explicitly.
          az webapp restart --name "$UI_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --output none

      - name: Wait for the UI Web App to report healthy
        run: |
          host_name=$(az webapp show --name "$UI_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName --output tsv)
          healthy=false
          for _ in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${host_name}/health" || true)
            if [[ "$status" == '200' ]]; then healthy=true; break; fi
            sleep 10
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::$UI_WEBAPP_NAME did not report healthy at https://${host_name}/health within the timeout."
            exit 1
          fi
          echo "$UI_WEBAPP_NAME is healthy: https://${host_name}/health"
