server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        # $uri/ resolves /docker/ to /docker/index.html, which is how every
        # section hub is linked. A genuinely missing page should 404.
        try_files $uri $uri/ =404;
        # The tutorials are edited often and are small; serving them stale is
        # more confusing than re-fetching them.
        add_header Cache-Control "no-cache";
    }
}
