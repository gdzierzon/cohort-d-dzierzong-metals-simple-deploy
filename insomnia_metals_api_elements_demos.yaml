      isPrivate: false
      description: ""
      sortKey: -1785260269503
    method: GET
    authentication:
      type: bearer
      token: "{{ _.auth_token }}"
    scripts:
      afterResponse: >-
        insomnia.test("Should return 200 Success", function() {
        		insomnia.expect(insomnia.response.code).to.equal(200);
        });


        const expected_list_count =
        parseInt(insomnia.environment.get("element_list_count"))

        const elements = insomnia.response.json();


        insomnia.test("Should return list of elements", function() {
            insomnia.expect(elements).to.be.an("array");
            insomnia.expect(elements).to.have.lengthOf(expected_list_count);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{base_url}}/api/elements/{{new_atomic_number}}"
