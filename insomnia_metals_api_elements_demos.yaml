      modified: 1788979306771
      isPrivate: false
      description: ""
      sortKey: -1785226545046.6875
    method: GET
    authentication:
      type: bearer
      token: "{{ _.auth_token }}"
    scripts:
      afterResponse: >-
        insomnia.test("Should return 200 Success", function() {
        		insomnia.expect(insomnia.response.code).to.equal(200);
        });


        const expected_list_count =
        parseInt(insomnia.environment.get("element_list_count")) + 1

        const new_atomic_number =
        parseInt(insomnia.environment.get("new_atomic_number"))

        const elements = insomnia.response.json();


        insomnia.test(`Should return list of ${expected_list_count} elements`,
        function() {
            insomnia.expect(elements).to.be.an("array");
            insomnia.expect(elements).to.have.lengthOf(expected_list_count);
        });


        const element = elements.find(
            element => element.atomic_number === new_atomic_number
        );


        insomnia.test("Should contain Invisium", function() {
        		insomnia.expect(element.atomic_number).to.equal(new_atomic_number);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
