  - url: "{{base_url}}/api/elements"
    name: Create New Element
    meta:
      id: req_8b1aa804bfa94826baeb9e2a28b5b633
      created: 1785264922078
      modified: 1788979112573
      isPrivate: false
      description: ""
      sortKey: -1785229808703.75
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
        		"atomic_number": {{new_atomic_number}},
        		"boiling_point_f": "10000.00",
        		"category": "INVISI_METAL",
        		"color": "clear",
        		"common_uses": "super powers",
        		"density": "100.00",
        		"is_magnetic": false,
        		"is_toxic": true,
        		"melting_point_f": "1000.00",
        		"name": "Invisium",
        		"state_at_room_temp": "SOLID",
        		"symbol": "Inv"
        	}
    headers:
      - name: Content-Type
        value: application/json
    authentication:
      type: bearer
      token: "{{ _.auth_token }}"
    scripts:
      afterResponse: >
        insomnia.test("Should return 201 Success", function() {
        		insomnia.expect(insomnia.response.code).to.equal(201);
        });


        const expected_atomic_number =
        parseInt(insomnia.environment.get("new_atomic_number"))

        const element = insomnia.response.json();


        insomnia.test("Should return element with atomic number", function() {
        		
        		insomnia.expect(element).to.have.property('atomic_number');
        		insomnia.expect(element.atomic_number).to.be.a('number');
        		insomnia.expect(element.atomic_number).to.equal(expected_atomic_number);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
